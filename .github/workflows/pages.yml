name: Build and deploy Hugo

on:
  push:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.167.0"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Hugo
        working-directory: ${{ runner.temp }}
        run: |
          hugo_archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$hugo_archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${hugo_archive}"

          mkdir -p "$RUNNER_TEMP/hugo"
          tar --extract --gzip --file "$hugo_archive" --directory "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --gc --minify --printPathWarnings --cacheDir "$RUNNER_TEMP/hugo-cache"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
